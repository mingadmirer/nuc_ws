# 红队参数 — 夹爪在 R2 右侧
r2_mission:
  ros__parameters:
    # ── 开环运动：速度(0~10000) + 时长(s) ──
    # Step0: 初始右移靠近
    initial_right_speed: 2000
    initial_right_time_s: 2.0

    # Step1: 向后 0.2m（向梅林方向前进）
    # 此部分在红队参数中废弃
    # backward_speed: 1250
    # backward_time_s: 1.0

    # Step6: 夹取后退开
    translate_left_speed: 2000
    translate_left_time_s: 5.0

    # Step7: 右旋 180°
    rotate_right_speed: 2000
    rotate_right_time_s: 1.2

    # ── 时序 ──
    startup_delay_s: 2.0       # 启动缓冲时间

    # 伺服批次参数（收集N帧→筛选一致帧→取均值→发一次→等move→重复）
    det_window_size: 30        # 收集有效检测帧数
    det_min_inliers: 20        # 最少一致性帧数（误差<consistency_pct）
    det_consistency_pct: 0.2   # 深度/像素偏离中位数<20%才算一致
    servo_move_duration_s: 0.3 # 每次移动持续时长（短步长，防过冲）

    # ── 深度伺服 ──
    # 速度2000≈25cm/s，目标600mm，±50mm内进入横向伺服
    target_depth_mm: 650.0
    depth_threshold_mm: 50.0
    kp: 1.2         # double类
    kd: 0.0         # 过冲则调大
    max_servo_speed: 2000
    min_servo_speed: 2000

    # ── 横向伺服 ──
    fx: 415.9                # Aurora RGB 横向焦距 (pixel)
    cx: 325.0                # 调低使目标偏右
    img_width: 640
    lateral_kp: 0.5
    lateral_kd: 0.0
    lateral_threshold_mm: 15.0
    lateral_max_speed: 1250
    lateral_min_speed: 1000
    lateral_timeout_s: 10.0  # 横向伺服超时

    # ── 最终盲走近端 (FINAL_APPROACH) ──
    # 600mm → 近端，开环平移覆盖相机不可靠区域
    final_approach_speed: 2000   # TRANSLATE_RIGHT 低速
    final_approach_time_s: 0.8  # ≈ 200mm @ speed=2000

    # ── 夹爪 ──
    grip_delay_s: 0.5
    wrist_angle_deg: 210
    wrist_delay_s: 0.5
    release_delay_s: 1.0      # COMPLETE后等待松开

    # ── 串口 ──
    serial_device: "/dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_326B326C3034-if00"
    baudrate: 115200
