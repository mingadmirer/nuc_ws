# 蓝队参数 — 夹爪在 R2 左侧
blue_mission:
  ros__parameters:
    # ── 开环运动：速度(0~10000) + 时长(s) ──
    initial_right_speed: 2000
    initial_right_time_s: 3.0

    # Step6: 夹取后退开
    translate_left_speed: 2000
    translate_left_time_s: 5.0

    # Step7: 左旋
    rotate_right_speed: 2000
    rotate_right_time_s: 1.2

    # ── 时序 ──
    startup_delay_s: 2.0

    # 伺服批次参数
    det_window_size: 30
    det_min_inliers: 20
    det_consistency_pct: 0.2
    servo_move_duration_s: 0.3

    # ── 深度伺服 ──
    target_depth_mm: 650.0
    depth_threshold_mm: 50.0
    kp: 1.2
    kd: 0.0
    max_servo_speed: 2000
    min_servo_speed: 2000

    # ── 横向伺服 ──
    fx: 415.9
    cx: 310.0        # 蓝队偏置
    img_width: 640
    lateral_kp: 0.5
    lateral_kd: 0.0
    lateral_threshold_mm: 15.0
    lateral_max_speed: 1250
    lateral_min_speed: 1000
    lateral_timeout_s: 10.0

    # ── 最终盲走近端 (FINAL_APPROACH) ──
    final_approach_speed: 2000
    final_approach_time_s: 0.8

    # ── 夹爪 ──
    grip_delay_s: 0.5
    wrist_angle_deg: 210
    wrist_delay_s: 0.5
    release_delay_s: 1.0

    # ── 串口 ──
    serial_device: "/dev/serial/by-id/usb-STMicroelectronics_STM32_Virtual_ComPort_326B326C3034-if00"
    baudrate: 115200
